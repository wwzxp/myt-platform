# myt 的 profile 补丁层。
#
# 装配顺序（由 dsh-app-boot 决定）：
#   空 entry 列表 → 各 bundle 的 cordis.patch.yml → 本文件 → 启动器 --patch
#
# 插件在这里按业务声明；启动器（apps/desktop-host）只负责读 profile 并装配。

- insert:
    # ── HTTP + 认证（dsh 的 Web 栈：有浏览器会话认证，不是裸端口）──
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: 0

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    # ── 宿主 SDK（mytHost 服务）──
    - id: myt-api-v2
      name: '@myt/myt-api-v2'
      config:
        baseUrl: 'http://127.0.0.1:7878'

    # ── 领域服务 ──
    - id: devices
      name: '@myt/devices'
      config:
        stateFile: './data/devices.json'

    - id: runs
      name: '@myt/runs'

    - id: flows
      name: '@myt/flow'

    # ── 流程图持久化 ──
    - id: workflows
      name: '@myt/workflows'

    - id: workflow-api
      name: '@myt/workflow-api'

    - id: system-api
      name: '@myt/system-api'

    # ── 前端静态资源 + 浏览器认证（访问页面时 set-cookie）──
    - id: frontend-static
      name: '@deepseek-ai/dsh-host-frontend-static'
      config:
        distIndex: 'F:\ai\myt_tools\packages\client\app\dist\index.html'

    - id: myt-api-v3
      name: '@myt/myt-api-v3'

    # ── 单机控制（adb）──
    - id: device-adb
      name: '@myt/device-adb'

    # ── 设备类 HTTP 接口（容器启停 / 设备清单 / 单机操作）──
    - id: device-api
      name: '@myt/device-api'

    # ── 登录类 HTTP 接口（设备行 / 登录源 / 批量登录）──
    - id: xhs-login
      name: '@myt/xhs-login'
      config:
        dataDir: './data'
        defaultHost: '192.168.0.113'

    # ── 业务 HTTP 接口（短信平台等，不碰设备）──
    - id: xhs-api
      name: '@myt/xhs-api'

    # ── 运行记录接口（列表 / 单条 / 创建）──
    - id: runs-api
      name: '@myt/runs-api'

    # ── flowgram 运行时接口（validate / run / report / result / cancel）──
    - id: task-api
      name: '@myt/task-api'
